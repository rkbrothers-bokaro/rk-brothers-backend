spring:
  application:
    name: rkbrothers-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

jwt:
  secret: ${JWT_SECRET:rk-brothers-local-secret-key-2024}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  upload:
    base-dir: ${UPLOAD_BASE_DIR:uploads}
  admin-email: ${ADMIN_EMAIL:}
  mail-from: ${MAIL_FROM:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
