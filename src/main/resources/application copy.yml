spring:
  application:
    name: rkbrothers-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true

jwt:
  secret: ${JWT_SECRET:rk-brothers-local-secret-key-2024}

app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  upload:
    base-dir: ${UPLOAD_BASE_DIR:uploads}
  admin-email: ${ADMIN_EMAIL:}
  mail-from: ${MAIL_FROM:}
  admin-setup-key: ${ADMIN_SETUP_KEY:}

gemini:
  api:
    key: ${GEMINI_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: "!prod"
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration
      - org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration
